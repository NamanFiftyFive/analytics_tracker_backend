# Whole stack in Docker:  docker compose up -d --build   (run from backend/, next to this file)
# Start order: db (healthy) -> migrate (dbmate up, then exits) -> api.
# Settings come from .env (this folder); the values below only override what differs inside Docker.
# Data lives in the "analytics_pgdata14" volume and survives restarts, rebuilds and `down`.
# Only `docker compose down -v` deletes it.
# Fixed project name: containers/networks are named "analytics-..." whatever the folder is called.
name: analytics

services:
  db:
    # Same major version as the local Homebrew Postgres, so dumps move between them cleanly.
    image: postgres:14-alpine
    container_name: analytics_db
    restart: unless-stopped
    # The postgres image reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from here and
    # creates that role and database the first time the volume is empty.
    env_file: .env
    ports:
      # Host port 5433 because the local Postgres already uses 5432. pgAdmin: localhost:5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ = the container's own variable, not one compose should fill in.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies new migrations, then exits. Already-applied ones are skipped, so it's safe on every `up`.
  migrate:
    build: .
    image: analytics-api:latest
    env_file: .env
    environment:
      DBMATE_MIGRATIONS_DIR: /app/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"  # schema.sql is kept up to date by local dbmate, not here
      DBMATE_WAIT: "true"
    # .env's DATABASE_URL points at localhost; inside Docker the database is the "db" service.
    command: >
      sh -c 'dbmate --url "postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB?sslmode=disable" up'
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: analytics-api:latest
    container_name: analytics_api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    # Fixed name (not prefixed with the folder name). "14" because an older Postgres 16 test
    # volume (hackathon_2026_pgdata) exists and Postgres 14 can't read 16's files.
    name: analytics_pgdata14
